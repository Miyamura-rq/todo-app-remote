<svg xmlns="http://www.w3.org/2000/svg" width="680" height="724" viewBox="0 0 680 724" role="img">
<title>ログインの全体の流れ</title>
<desc>登録、ログイン、ログイン後の毎回のリクエスト、ログアウトの4つの場面で、ブラウザ・サーバー・DB の間で何が送られ、何が保存され、何がハッシュで確かめられるかを示す図。</desc>
<style>
text{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;dominant-baseline:central;text-anchor:middle}
.l{text-anchor:start}
.t{font-size:14px;font-weight:500;fill:#2C2C2A}
.s{font-size:12px;fill:#5F5E5A}
rect{stroke-width:0.8}
.g rect,rect.g{fill:#F1EFE8;stroke:#888780}
.tl rect,rect.tl{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#085041}.tl .s{fill:#0F6E56}
.pu rect,rect.pu{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#3C3489}.pu .s{fill:#534AB7}
.co rect,rect.co{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#712B13}.co .s{fill:#993C1D}
.a{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.at{stroke:#1D9E75;stroke-width:1.5;fill:none}
.band{fill:none;stroke:#B4B2A9;stroke-dasharray:4 4}
</style>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="724" fill="#FFFFFF" stroke="none"/>

<rect class="tl" x="40" y="20" width="14" height="14" rx="3"/>
<text class="s l" x="60" y="27">Cookie で送り合う</text>
<rect class="pu" x="196" y="20" width="14" height="14" rx="3"/>
<text class="s l" x="216" y="27">サーバー（DB）だけに保存</text>
<rect class="co" x="391" y="20" width="14" height="14" rx="3"/>
<text class="s l" x="411" y="27">ハッシュを使う</text>
<rect class="g" x="547" y="20" width="14" height="14" rx="3"/>
<text class="s l" x="567" y="27">そのほか</text>

<g class="g"><rect x="40" y="50" width="160" height="36" rx="8"/><text class="t" x="120" y="68">ブラウザ</text></g>
<g class="g"><rect x="240" y="50" width="200" height="36" rx="8"/><text class="t" x="340" y="68">サーバー（Express）</text></g>
<g class="g"><rect x="480" y="50" width="160" height="36" rx="8"/><text class="t" x="560" y="68">DB（PostgreSQL）</text></g>

<rect class="band" x="24" y="100" width="632" height="104" rx="12"/>
<text class="t l" x="40" y="117">登録（7-3）</text>
<g class="g"><rect x="40" y="132" width="160" height="56" rx="8"/><text class="t" x="120" y="150">メール＋パスワード</text><text class="s" x="120" y="169">フォームから送る</text></g>
<line class="a" x1="202" y1="160" x2="238" y2="160" marker-end="url(#ag)"/>
<g class="co"><rect x="240" y="132" width="200" height="56" rx="8"/><text class="t" x="340" y="150">ハッシュにする</text><text class="s" x="340" y="169">新しいソルト＋パスワード</text></g>
<line class="a" x1="442" y1="160" x2="478" y2="160" marker-end="url(#ag)"/>
<g class="pu"><rect x="480" y="132" width="160" height="56" rx="8"/><text class="t" x="560" y="150">users に保存</text><text class="s" x="560" y="169">ソルトとハッシュ</text></g>

<rect class="band" x="24" y="216" width="632" height="180" rx="12"/>
<text class="t l" x="40" y="233">ログイン（7-4）</text>
<g class="g"><rect x="40" y="248" width="160" height="56" rx="8"/><text class="t" x="120" y="266">メール＋パスワード</text><text class="s" x="120" y="285">フォームから送る</text></g>
<line class="a" x1="202" y1="276" x2="238" y2="276" marker-end="url(#ag)"/>
<g class="co"><rect x="240" y="248" width="200" height="56" rx="8"/><text class="t" x="340" y="266">ハッシュして比べる</text><text class="s" x="340" y="285">保存したソルト＋入力</text></g>
<line class="a" x1="442" y1="276" x2="478" y2="276" marker-start="url(#ag)" marker-end="url(#ag)"/>
<g class="pu"><rect x="480" y="248" width="160" height="56" rx="8"/><text class="t" x="560" y="266">users の行を探す</text><text class="s" x="560" y="285">ソルトとハッシュ</text></g>
<line class="a" x1="340" y1="305" x2="340" y2="322" marker-end="url(#ag)"/>
<g class="tl"><rect x="40" y="324" width="160" height="56" rx="8"/><text class="t" x="120" y="342">Cookie に保存</text><text class="s" x="120" y="361">合言葉だけ届く</text></g>
<line class="at" x1="238" y1="352" x2="202" y2="352" marker-end="url(#at)"/>
<g class="co"><rect x="240" y="324" width="200" height="56" rx="8"/><text class="t" x="340" y="342">一致したら合言葉を作る</text><text class="s" x="340" y="361">DB 用はハッシュにする</text></g>
<line class="a" x1="442" y1="352" x2="478" y2="352" marker-end="url(#ag)"/>
<g class="pu"><rect x="480" y="324" width="160" height="56" rx="8"/><text class="t" x="560" y="342">sessions に保存</text><text class="s" x="560" y="361">ハッシュ・誰・期限</text></g>

<rect class="band" x="24" y="408" width="632" height="180" rx="12"/>
<text class="t l" x="40" y="425">ログイン後のリクエスト（毎回。7-5）</text>
<g class="tl"><rect x="40" y="440" width="160" height="56" rx="8"/><text class="t" x="120" y="458">Cookie: 合言葉</text><text class="s" x="120" y="477">自動でつく</text></g>
<line class="at" x1="202" y1="468" x2="238" y2="468" marker-end="url(#at)"/>
<g class="co"><rect x="240" y="440" width="200" height="56" rx="8"/><text class="t" x="340" y="458">ハッシュして引く</text><text class="s" x="340" y="477">パスワードは使わない</text></g>
<line class="a" x1="442" y1="468" x2="478" y2="468" marker-start="url(#ag)" marker-end="url(#ag)"/>
<g class="pu"><rect x="480" y="440" width="160" height="56" rx="8"/><text class="t" x="560" y="458">sessions を引く</text><text class="s" x="560" y="477">user_id が分かる</text></g>
<line class="a" x1="340" y1="497" x2="340" y2="514" marker-end="url(#ag)"/>
<g class="g"><rect x="40" y="516" width="160" height="56" rx="8"/><text class="t" x="120" y="534">ToDo が届く</text><text class="s" x="120" y="553">自分の分だけ</text></g>
<line class="a" x1="238" y1="544" x2="202" y2="544" marker-end="url(#ag)"/>
<g class="g"><rect x="240" y="516" width="200" height="56" rx="8"/><text class="t" x="340" y="534">その人の ToDo だけ</text><text class="s" x="340" y="553">user_id で絞る</text></g>

<rect class="band" x="24" y="600" width="632" height="104" rx="12"/>
<text class="t l" x="40" y="617">ログアウト（7-4）</text>
<g class="tl"><rect x="40" y="632" width="160" height="56" rx="8"/><text class="t" x="120" y="650">ログアウト</text><text class="s" x="120" y="669">Cookie: 合言葉</text></g>
<line class="at" x1="202" y1="660" x2="238" y2="660" marker-end="url(#at)"/>
<g class="co"><rect x="240" y="632" width="200" height="56" rx="8"/><text class="t" x="340" y="650">ハッシュで探して消す</text><text class="s" x="340" y="669">Cookie も消させる</text></g>
<line class="a" x1="442" y1="660" x2="478" y2="660" marker-end="url(#ag)"/>
<g class="pu"><rect x="480" y="632" width="160" height="56" rx="8"/><text class="t" x="560" y="650">行を消す</text><text class="s" x="560" y="669">合言葉が使えなくなる</text></g>
</svg>
